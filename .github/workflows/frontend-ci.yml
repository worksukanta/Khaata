# Frontend CI — Khaata (FE-001)
#
# Runs on every push / PR to main when frontend files or this workflow change.
#
# Three steps matching the FE-001 acceptance criteria:
#
#   typecheck  — tsc --noEmit (strict mode, no type errors allowed)
#   lint       — eslint (typescript-eslint rules)
#   test       — vitest run (jsdom environment; 6 tests)
#   build      — tsc -b && vite build (production bundle, includes source maps)
#
# Does NOT touch the backend; backend jobs are in backend-ci.yml.
# No secrets required.  Third-party actions are pinned to stable tags.

name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: frontend

jobs:
  # ---------------------------------------------------------------------------
  # Single job: typecheck → lint → test → build
  # Kept in one job so npm install is paid only once.
  # ---------------------------------------------------------------------------
  frontend:
    name: "Frontend (Node ${{ matrix.node-version }})"
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: ["22"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Vitest (unit / smoke tests)
        run: npm test

      - name: Production build
        run: npm run build
