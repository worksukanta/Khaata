openapi: 3.1.0
info:
  title: Khaata API
  version: 1.0.0
  description: >
    V1 API contract baseline for Khaata. This specification is a starting
    contract; implementation must keep API_CONTRACT.md and this file aligned.
servers:
  - url: /api/v1
security:
  - sessionCookie: []
paths:
  /auth/csrf/:
    get:
      summary: Bootstrap CSRF cookie
      security: []
      responses:
        "200":
          description: CSRF cookie initialized
  /auth/register/:
    post:
      summary: Register an account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/ValidationError"
  /auth/login/:
    post:
      summary: Create authenticated session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        "200": { description: Session established }
        "401": { description: Invalid credentials }
  /auth/logout/:
    post:
      summary: End current session
      responses:
        "204": { description: Logged out }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /auth/me/:
    get:
      summary: Get current user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
    patch:
      summary: Update profile preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name: { type: string, maxLength: 120 }
                timezone: { type: string, maxLength: 64 }
      responses:
        "200": { description: Profile updated }
  /books/:
    get:
      summary: List and search books
      parameters:
        - in: query
          name: type
          schema: { type: string, enum: [MONTHLY, EVENT, GENERAL] }
        - in: query
          name: search
          schema: { type: string }
        - in: query
          name: is_archived
          schema: { type: boolean }
        - in: query
          name: page
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Paginated books
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaginatedBooks" }
    post:
      summary: Create an event or general book
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateBookRequest" }
      responses:
        "201":
          description: Book created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Book" }
        "400":
          $ref: "#/components/responses/ValidationError"
  /books/monthly/{year}/{month}/ensure/:
    post:
      summary: Idempotently ensure monthly book
      parameters:
        - in: path
          name: year
          required: true
          schema: { type: integer, minimum: 2000, maximum: 2200 }
        - in: path
          name: month
          required: true
          schema: { type: integer, minimum: 1, maximum: 12 }
      responses:
        "200": { description: Existing monthly book returned }
        "201": { description: Monthly book created }
        "400": { $ref: "#/components/responses/ValidationError" }
  /books/{id}/:
    parameters:
      - $ref: "#/components/parameters/UUID"
    get:
      summary: Retrieve an owned book
      responses:
        "200":
          description: Book
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Book" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      summary: Update editable book metadata
      responses:
        "200": { description: Book updated }
        "400": { $ref: "#/components/responses/ValidationError" }
        "404": { $ref: "#/components/responses/NotFound" }
  /books/{id}/archive/:
    post:
      summary: Archive an event/general book
      parameters:
        - $ref: "#/components/parameters/UUID"
      responses:
        "200": { description: Book archived }
  /books/{id}/restore/:
    post:
      summary: Restore an archived event/general book
      parameters:
        - $ref: "#/components/parameters/UUID"
      responses:
        "200": { description: Book restored }
  /categories/:
    get:
      summary: List categories
      parameters:
        - in: query
          name: type
          schema: { type: string, enum: [INCOME, EXPENSE] }
        - in: query
          name: is_active
          schema: { type: boolean }
        - in: query
          name: search
          schema: { type: string }
      responses:
        "200":
          description: Paginated categories
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaginatedCategories" }
    post:
      summary: Create a category (unique per user and type, case-insensitive name)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCategoryRequest" }
      responses:
        "201":
          description: Category created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Category" }
        "400": { $ref: "#/components/responses/ValidationError" }
  /categories/{id}/:
    parameters:
      - $ref: "#/components/parameters/UUID"
    patch:
      summary: Rename or (de)activate a category
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateCategoryRequest" }
      responses:
        "200":
          description: Category updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Category" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "404": { $ref: "#/components/responses/NotFound" }
  /payment-methods/:
    get:
      summary: List payment method labels
      parameters:
        - in: query
          name: is_active
          schema: { type: boolean }
        - in: query
          name: search
          schema: { type: string }
      responses:
        "200":
          description: Paginated payment methods
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaginatedPaymentMethods" }
    post:
      summary: Create a payment method label (unique per user, case-insensitive name)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePaymentMethodRequest" }
      responses:
        "201":
          description: Payment method created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentMethod" }
        "400": { $ref: "#/components/responses/ValidationError" }
  /payment-methods/{id}/:
    parameters:
      - $ref: "#/components/parameters/UUID"
    patch:
      summary: Rename or (de)activate a payment method
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdatePaymentMethodRequest" }
      responses:
        "200":
          description: Payment method updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentMethod" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "404": { $ref: "#/components/responses/NotFound" }
  /transactions/:
    get:
      summary: List and filter active transactions
      parameters:
        - in: query
          name: book_id
          schema: { type: string, format: uuid }
        - in: query
          name: type
          schema: { type: string, enum: [INCOME, EXPENSE] }
        - in: query
          name: category_id
          schema: { type: string, format: uuid }
        - in: query
          name: payment_method_id
          schema: { type: string, format: uuid }
        - in: query
          name: date_from
          schema: { type: string, format: date }
        - in: query
          name: date_to
          schema: { type: string, format: date }
        - in: query
          name: search
          schema: { type: string }
        - in: query
          name: ordering
          description: Default is `-transaction_date,-created_at`; unknown values fall back to the default. Ties are broken by `-created_at`, `-id`.
          schema:
            type: string
            enum: [transaction_date, -transaction_date, amount, -amount, created_at, -created_at]
        - in: query
          name: page
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Paginated transactions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaginatedTransactions" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      summary: Create transaction
      description: >-
        Amount must be greater than zero with at most 2 decimal places. Category type must match the
        transaction type. Referenced book, category and payment method must belong to the user; the
        category and payment method must be active; the book must not be archived; a MONTHLY book only
        accepts dates inside its month.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TransactionWrite" }
      responses:
        "201":
          description: Transaction created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Transaction" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401": { $ref: "#/components/responses/Unauthorized" }
  /transactions/{id}/:
    parameters:
      - $ref: "#/components/parameters/UUID"
    get:
      summary: Retrieve transaction
      description: Soft-deleted transactions return 404.
      responses:
        "200":
          description: Transaction
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Transaction" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      summary: Edit transaction
      description: >-
        Partial update; invariants are validated after applying the changes. Inactive categories and
        payment methods are rejected only when newly selected; an unchanged existing reference is kept.
        Changing the date of a transaction in a MONTHLY book to another month atomically moves it to
        that month's book (created on demand). Transactions in archived books are read-only.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TransactionUpdate" }
      responses:
        "200":
          description: Transaction updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Transaction" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      summary: Soft-delete transaction
      description: Idempotent; repeating the call on an already-deleted transaction returns 204. Transactions in archived books cannot be deleted (400).
      responses:
        "204": { description: Soft-deleted }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /budgets/:
    get:
      summary: List budgets
      description: >-
        Owner-scoped, paginated. Filters combine with AND; malformed values return 400. Fixed
        deterministic order: newest period first (budgets without a period, i.e. event budgets,
        last), then scope, `-created_at`, `-id`. There is no `ordering` parameter. Each item carries
        the same derived figures as the detail endpoint.
      parameters:
        - in: query
          name: scope
          schema: { type: string, enum: [MONTHLY_OVERALL, EVENT] }
        - in: query
          name: year
          schema: { type: integer, minimum: 2000, maximum: 2200 }
        - in: query
          name: month
          schema: { type: integer, minimum: 1, maximum: 12 }
        - in: query
          name: book_id
          schema: { type: string, format: uuid }
        - in: query
          name: page
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Paginated budgets
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaginatedBudgets" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      summary: Create budget
      description: >-
        `MONTHLY_OVERALL` requires `year` (2000-2200) and `month` (1-12) and rejects `book_id`; no
        monthly book needs to exist. `EVENT` requires `book_id` of one of the user's EVENT books and
        rejects `year`/`month`. One monthly budget per user/month and one event budget per book
        (duplicate returns 400). A missing or other-user `book_id` returns an identical 400 on
        `book_id`. `total_limit` must be >= 0 (zero allowed) with at most 2 decimal places.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BudgetWrite" }
      responses:
        "201":
          description: Budget created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Budget" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /budgets/{id}/:
    parameters:
      - $ref: "#/components/parameters/UUID"
    get:
      summary: Retrieve budget with calculated utilization
      description: >-
        Spending is derived on every read from active EXPENSE transactions (never stored). A
        MONTHLY_OVERALL budget counts expenses from every book the user owns (any type, archived or
        not) dated inside the calendar month; an EVENT budget counts expenses of its event book
        regardless of date. Income and soft-deleted transactions never count; each transaction counts
        once per budget. Uncategorised spending consumes the overall limit but no category allocation.
      responses:
        "200":
          description: Budget details and calculated totals
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Budget" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      summary: Update budget limit / monthly period
      description: >-
        Partial update of `total_limit` and, for MONTHLY_OVERALL budgets, `year`/`month`. `scope` and
        `book_id` are immutable (a differing value returns 400; the same value is accepted).
        `total_limit` may not be lowered below the current allocation total (400). Existing spending
        above a reduced limit is allowed; the response reports OVER_BUDGET. Transactions are never
        modified.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BudgetUpdate" }
      responses:
        "200":
          description: Budget updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Budget" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /budgets/{id}/allocations/:
    put:
      summary: Atomically replace category allocations
      description: >-
        Full replacement inside one database transaction with the parent budget row locked
        (`select_for_update`). Each category at most once; amounts >= 0 (zero allowed); every
        category must be an active EXPENSE category owned by the user; the sum must not exceed
        `total_limit` (equal is allowed). An empty list removes all allocations. Any failure leaves
        the previous allocations untouched. A missing or other-user category returns the same
        generic message. Item-level errors are keyed by the zero-based item index, e.g.
        `{"allocations": {"0": {"category_id": ["..."]}}}`; the total-limit error is
        `{"allocations": ["..."]}`. An existing allocation to a since-deactivated category stays
        visible, but a replacement that re-submits it is a new selection and is rejected.
      parameters:
        - $ref: "#/components/parameters/UUID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AllocationsReplace" }
      responses:
        "200":
          description: Allocations replaced; returns the full budget
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Budget" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /reports/monthly/:
    get:
      summary: Combined monthly dashboard
      parameters:
        - in: query
          name: year
          required: true
          schema: { type: integer }
        - in: query
          name: month
          required: true
          schema: { type: integer, minimum: 1, maximum: 12 }
      responses:
        "200":
          description: Combined monthly totals and book-type breakdown
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MonthlyReport" }
  /reports/books/{id}/:
    get:
      summary: Book-scoped report
      parameters:
        - $ref: "#/components/parameters/UUID"
      responses:
        "200": { description: Book report }
        "404": { $ref: "#/components/responses/NotFound" }
  /reports/budget-utilization/:
    get:
      summary: Monthly budget utilization
      parameters:
        - in: query
          name: year
          required: true
          schema: { type: integer }
        - in: query
          name: month
          required: true
          schema: { type: integer, minimum: 1, maximum: 12 }
      responses:
        "200": { description: Budget utilization }
  /exports/transactions.csv:
    get:
      summary: Export filtered active transactions as CSV
      responses:
        "200":
          description: CSV file
          content:
            text/csv:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: sessionid
  parameters:
    UUID:
      in: path
      name: id
      required: true
      schema: { type: string, format: uuid }
  responses:
    Unauthorized:
      description: Authentication required
    NotFound:
      description: Resource not found or inaccessible
    ValidationError:
      description: Validation error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
  schemas:
    Money:
      type: string
      pattern: '^\d{1,12}\.\d{2}$'
      examples: ["250.00"]
    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, format: password, minLength: 10 }
        display_name: { type: string, maxLength: 120 }
    User:
      type: object
      required: [id, email, timezone]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        display_name: { type: string, nullable: true }
        timezone: { type: string, example: Asia/Kolkata }
    Book:
      type: object
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [MONTHLY, EVENT, GENERAL] }
        name: { type: string, maxLength: 150 }
        description: { type: string, nullable: true }
        year: { type: integer, nullable: true }
        month: { type: integer, nullable: true, minimum: 1, maximum: 12 }
        start_date: { type: string, format: date, nullable: true }
        end_date: { type: string, format: date, nullable: true }
        opening_balance: { $ref: "#/components/schemas/Money" }
        is_archived: { type: boolean }
    CreateBookRequest:
      type: object
      required: [type, name]
      properties:
        type: { type: string, enum: [EVENT, GENERAL] }
        name: { type: string, minLength: 1, maxLength: 150 }
        description: { type: string, maxLength: 5000 }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date }
    TransactionWrite:
      type: object
      required: [book_id, type, amount, transaction_date]
      properties:
        book_id: { type: string, format: uuid }
        type: { type: string, enum: [INCOME, EXPENSE] }
        amount: { $ref: "#/components/schemas/Money" }
        transaction_date: { type: string, format: date }
        category_id: { type: string, format: uuid, nullable: true }
        payment_method_id: { type: string, format: uuid, nullable: true }
        description: { type: string, maxLength: 500 }
    TransactionUpdate:
      type: object
      description: Partial update; all fields optional. `book_id`, `type`, `amount` and `transaction_date` cannot be null.
      properties:
        book_id: { type: string, format: uuid }
        type: { type: string, enum: [INCOME, EXPENSE] }
        amount: { $ref: "#/components/schemas/Money" }
        transaction_date: { type: string, format: date }
        category_id: { type: string, format: uuid, nullable: true }
        payment_method_id: { type: string, format: uuid, nullable: true }
        description: { type: string, maxLength: 500, nullable: true }
    Transaction:
      type: object
      required: [id, book_id, type, amount, transaction_date, category, payment_method, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        book_id: { type: string, format: uuid }
        type: { type: string, enum: [INCOME, EXPENSE] }
        amount: { $ref: "#/components/schemas/Money" }
        transaction_date: { type: string, format: date }
        category:
          nullable: true
          type: object
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            type: { type: string, enum: [INCOME, EXPENSE] }
        payment_method:
          nullable: true
          type: object
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
        description: { type: string, nullable: true, maxLength: 500 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    SignedMoney:
      type: string
      description: Decimal string that may be negative (e.g. remaining budget when overspent).
      pattern: '^-?\d{1,12}\.\d{2}$'
      examples: ["-100.00"]
    BudgetWrite:
      type: object
      required: [scope, total_limit]
      properties:
        scope: { type: string, enum: [MONTHLY_OVERALL, EVENT] }
        year: { type: integer, minimum: 2000, maximum: 2200, description: "MONTHLY_OVERALL only" }
        month: { type: integer, minimum: 1, maximum: 12, description: "MONTHLY_OVERALL only" }
        book_id: { type: string, format: uuid, description: "EVENT only" }
        total_limit: { $ref: "#/components/schemas/Money" }
    BudgetUpdate:
      type: object
      description: Partial update; all fields optional. `scope` and `book_id` are immutable.
      properties:
        scope: { type: string, enum: [MONTHLY_OVERALL, EVENT] }
        year: { type: integer, minimum: 2000, maximum: 2200, nullable: true }
        month: { type: integer, minimum: 1, maximum: 12, nullable: true }
        book_id: { type: string, format: uuid, nullable: true }
        total_limit: { $ref: "#/components/schemas/Money" }
    AllocationsReplace:
      type: object
      required: [allocations]
      properties:
        allocations:
          type: array
          items:
            type: object
            required: [category_id, amount]
            properties:
              category_id: { type: string, format: uuid }
              amount: { $ref: "#/components/schemas/Money" }
    BudgetAllocation:
      type: object
      properties:
        category:
          type: object
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            type: { type: string, enum: [EXPENSE] }
            is_active: { type: boolean }
        amount: { $ref: "#/components/schemas/Money" }
        spent: { $ref: "#/components/schemas/Money" }
        remaining: { $ref: "#/components/schemas/SignedMoney" }
        utilization_percent: { type: string, nullable: true, pattern: '^\d{1,12}\.\d{2}$' }
        status:
          type: string
          enum: [ON_TRACK, NEAR_LIMIT, OVER_BUDGET, UNBUDGETED_SPENDING]
    Budget:
      type: object
      description: >-
        Budget definition plus values derived from active expense transactions on every read.
        `utilization_percent` is spent / limit * 100 (Decimal, half-up, 2 dp) and is `null` only when
        the limit is 0 and spent > 0 (UNBUDGETED_SPENDING). Status uses the exact ratio: OVER_BUDGET
        when spent > limit; NEAR_LIMIT when 80% <= ratio <= 100%; otherwise ON_TRACK. A zero limit
        with zero spending is ON_TRACK / "0.00". `NOT_SET` appears only in report endpoints (BE-007).
      properties:
        id: { type: string, format: uuid }
        scope: { type: string, enum: [MONTHLY_OVERALL, EVENT] }
        book_id: { type: string, format: uuid, nullable: true }
        year: { type: integer, nullable: true }
        month: { type: integer, nullable: true }
        total_limit: { $ref: "#/components/schemas/Money" }
        allocations:
          type: array
          description: Ordered by category name.
          items: { $ref: "#/components/schemas/BudgetAllocation" }
        allocated_total: { $ref: "#/components/schemas/Money" }
        unallocated: { $ref: "#/components/schemas/Money", description: "total_limit - allocated_total" }
        spent: { $ref: "#/components/schemas/Money" }
        remaining: { $ref: "#/components/schemas/SignedMoney", description: "total_limit - spent; negative when overspent" }
        utilization_percent: { type: string, nullable: true, pattern: '^\d{1,12}\.\d{2}$' }
        status:
          type: string
          enum: [ON_TRACK, NEAR_LIMIT, OVER_BUDGET, UNBUDGETED_SPENDING]
        unallocated_spent: { $ref: "#/components/schemas/Money", description: "Spending not covered by any allocation (uncategorised plus categories without an allocation)" }
        uncategorised_spent: { $ref: "#/components/schemas/Money" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    PaginatedBudgets:
      type: object
      properties:
        count: { type: integer }
        next: { type: string, nullable: true }
        previous: { type: string, nullable: true }
        results:
          type: array
          items: { $ref: "#/components/schemas/Budget" }
    MonthlyReport:
      type: object
      required: [period, currency, income_total, expense_total, net_cash_flow, book_type_breakdown]
      properties:
        period:
          type: object
          required: [year, month]
          properties:
            year: { type: integer }
            month: { type: integer, minimum: 1, maximum: 12 }
        currency: { type: string, enum: [INR] }
        income_total: { $ref: "#/components/schemas/Money" }
        expense_total: { $ref: "#/components/schemas/Money" }
        net_cash_flow: { $ref: "#/components/schemas/Money" }
        book_type_breakdown:
          type: array
          items:
            type: object
            properties:
              book_type: { type: string, enum: [MONTHLY, EVENT, GENERAL] }
              income: { $ref: "#/components/schemas/Money" }
              expenses: { $ref: "#/components/schemas/Money" }
        category_breakdown:
          type: array
          items: { type: object }
        budget:
          type: object
          properties:
            total_limit: { $ref: "#/components/schemas/Money" }
            spent: { $ref: "#/components/schemas/Money" }
            remaining: { $ref: "#/components/schemas/Money" }
            utilization_percent: { $ref: "#/components/schemas/Money" }
            status:
              type: string
              enum: [NOT_SET, ON_TRACK, NEAR_LIMIT, OVER_BUDGET, UNBUDGETED_SPENDING]
        recent_transactions:
          type: array
          items: { $ref: "#/components/schemas/Transaction" }
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details: { type: object, additionalProperties: true }
    PaginatedBooks:
      type: object
      properties:
        count: { type: integer }
        next: { type: string, nullable: true }
        previous: { type: string, nullable: true }
        results:
          type: array
          items: { $ref: "#/components/schemas/Book" }
    Category:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 80 }
        type: { type: string, enum: [INCOME, EXPENSE] }
        is_default: { type: boolean }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CreateCategoryRequest:
      type: object
      required: [name, type]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        type: { type: string, enum: [INCOME, EXPENSE] }
    UpdateCategoryRequest:
      type: object
      description: >
        Name and/or active status only. If `type` is supplied it must equal
        the existing category type — the server rejects a change with 400.
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        is_active: { type: boolean }
        type: { type: string, enum: [INCOME, EXPENSE], description: "Must equal existing type. Provided for client-side idempotency; a change is rejected." }
    PaginatedCategories:
      type: object
      properties:
        count: { type: integer }
        next: { type: string, nullable: true }
        previous: { type: string, nullable: true }
        results:
          type: array
          items: { $ref: "#/components/schemas/Category" }
    PaymentMethod:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 60 }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CreatePaymentMethodRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
    UpdatePaymentMethodRequest:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        is_active: { type: boolean }
    PaginatedPaymentMethods:
      type: object
      properties:
        count: { type: integer }
        next: { type: string, nullable: true }
        previous: { type: string, nullable: true }
        results:
          type: array
          items: { $ref: "#/components/schemas/PaymentMethod" }

    PaginatedTransactions:
      type: object
      properties:
        count: { type: integer }
        next: { type: string, nullable: true }
        previous: { type: string, nullable: true }
        results:
          type: array
          items: { $ref: "#/components/schemas/Transaction" }
